<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Client</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Cloud Client</h1>
        <p>This application demonstrates how a frontend can communicate with backend services.</p>

        <!--Server Data Section-->
        <section class="server-data">
            <h2>Server Data</h2>
            
            <button id="load-data-btn">Load Data</button>
            <div id="server-response"></div>
            <p>This section will display data fetched from the backend server.</p>
 
        </section>

        <section class="server-data">
            <h2>Send Data</h2>
            <form id="send-data-form">
                <label for="data-input">Enter Data:</label>
                <input type="text" id="data-input" name="data-input" placeholder="Enter data here..." required>
                <button type="submit">Send Data</button>
            </form>
            <div id="send-data-response"></div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
